name: Meta Archetype Transfer Audit

on:
  push:
    branches:
      - agent/meta-archetype-transfer-audit
    paths:
      - .github/workflows/meta-transfer-audit.yml
      - docs/META_ARCHETYPE_TRANSFER_2026-08-05.md
      - research/meta/**
      - src/thun_deckbuilder/archetype_transfer.py
      - tests/test_archetype_transfer.py
  pull_request:
    paths:
      - .github/workflows/meta-transfer-audit.yml
      - docs/META_ARCHETYPE_TRANSFER_2026-08-05.md
      - research/meta/**
      - src/thun_deckbuilder/archetype_transfer.py
      - tests/test_archetype_transfer.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run complete test suite
        run: python -m pytest

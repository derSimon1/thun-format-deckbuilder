name: Global Calibration PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-calibration-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore card database cache
        id: cards-cache
        uses: actions/cache/restore@v4
        with:
          path: data/cards.db
          key: global-pr-cards-db-v1-${{ runner.os }}-${{ hashFiles('config/thun.toml', 'scripts/ci_global_validation.py') }}

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests and global validation
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/global

          python -m pytest 2>&1 | tee artifacts/global/pytest.log
          TEST_STATUS=${PIPESTATUS[0]}

          THUN_REUSE_CARD_DATABASE=1 python scripts/ci_global_validation.py 2>&1 \
            | tee artifacts/global/global-validation.log
          VALIDATION_STATUS=${PIPESTATUS[0]}

          {
            echo "TEST_STATUS=${TEST_STATUS}"
            echo "VALIDATION_STATUS=${VALIDATION_STATUS}"
          } > artifacts/global/status.env
          exit 0

      - name: Save card database cache
        if: steps.cards-cache.outputs.cache-hit != 'true' && hashFiles('data/cards.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/cards.db
          key: global-pr-cards-db-v1-${{ runner.os }}-${{ hashFiles('config/thun.toml', 'scripts/ci_global_validation.py') }}

      - name: Upload global validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-calibration-pr-${{ github.run_number }}
          path: artifacts/global/
          retention-days: 7
          if-no-files-found: error

      - name: Enforce results
        if: always()
        shell: bash
        run: |
          if [ ! -f artifacts/global/status.env ]; then
            echo "Global validation did not produce a status file."
            exit 1
          fi
          source artifacts/global/status.env
          if [ "$TEST_STATUS" -ne 0 ] || [ "$VALIDATION_STATUS" -ne 0 ]; then
            echo "Global validation failed: tests=$TEST_STATUS validation=$VALIDATION_STATUS"
            exit 1
          fi
          echo "Tests and global validation passed."

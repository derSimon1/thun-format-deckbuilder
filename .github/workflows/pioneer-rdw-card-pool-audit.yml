name: Pioneer RDW Card-Pool Audit

on:
  push:
    branches:
      - integration/deckbuilder-v3
  pull_request:
    paths:
      - .github/workflows/pioneer-rdw-card-pool-audit.yml
      - docs/PIONEER_RDW_THUN_AUDIT_2026-08-05.md
      - research/meta/pioneer_rdw_*
      - scripts/audit_pioneer_rdw_transfer.py
      - scripts/download_scryfall.py
      - src/thun_deckbuilder/rdw_transfer_audit.py
      - tests/test_download_scryfall.py
      - tests/test_pioneer_rdw_review.py
      - tests/test_rdw_transfer_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Download current Scryfall data
        run: python scripts/download_scryfall.py

      - name: Build current Thun card database
        run: python scripts/build_index.py

      - name: Run complete test suite
        run: python -m pytest

      - name: Export current legal Thun card pool
        run: python export_legal_pool.py

      - name: Validate legal-pool CSV schema
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("thun_legal_pool.csv")
          if not path.is_file():
              raise SystemExit("thun_legal_pool.csv was not created")

          with path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              required = {"power", "toughness", "oracle_tags"}
              missing = required - set(reader.fieldnames or [])
              if missing:
                  raise SystemExit(f"Missing CSV columns: {sorted(missing)}")
              rows = list(reader)

          if not rows:
              raise SystemExit("thun_legal_pool.csv contains no legal cards")

          if not any(row.get("power") or row.get("toughness") for row in rows):
              raise SystemExit("CSV contains no creature power/toughness values")

          print(f"Validated {len(rows):,} legal cards with power/toughness/oracle_tags columns")
          PY

      - name: Run Pioneer RDW transfer audit
        run: |
          mkdir -p artifacts/pioneer-rdw
          python scripts/audit_pioneer_rdw_transfer.py \
            --json-output artifacts/pioneer-rdw/audit.json \
            --markdown-output artifacts/pioneer-rdw/audit.md

      - name: Upload legal card pool CSV
        uses: actions/upload-artifact@v4
        with:
          name: thun-legal-pool-${{ github.run_number }}
          path: thun_legal_pool.csv
          retention-days: 7
          if-no-files-found: error

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: pioneer-rdw-card-pool-audit-${{ github.run_number }}
          path: artifacts/pioneer-rdw/
          retention-days: 7
          if-no-files-found: error

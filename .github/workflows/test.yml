name: Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Generate and validate Izzet Prowess V2
        run: python scripts/ci_generate_prowess.py
      - name: Upload Izzet Prowess V2
        uses: actions/upload-artifact@v4
        with:
          name: izzet-prowess-v2
          path: |
            izzet-prowess-v2-arena.txt
            izzet-prowess-v2-validation.txt
          if-no-files-found: error

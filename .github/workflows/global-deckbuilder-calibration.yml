name: Global Deckbuilder Calibration

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - codex/global-deckbuilder-calibration
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "Validation depth"
        required: false
        default: full
        type: choice
        options:
          - fast
          - full

permissions:
  contents: read

concurrency:
  group: global-deckbuilder-calibration
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out global calibration branch
        uses: actions/checkout@v4
        with:
          ref: codex/global-deckbuilder-calibration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore card database cache
        id: cards-cache
        uses: actions/cache/restore@v4
        with:
          path: data/cards.db
          key: global-cards-db-v2-${{ runner.os }}-${{ hashFiles('config/thun.toml', 'scripts/ci_global_validation.py', 'scripts/ci_global_validation_fast.py') }}

      - name: Restore previous global report
        uses: actions/cache/restore@v4
        with:
          path: .ci-baseline/global-report.json
          key: global-deckbuilder-report-${{ github.run_id }}
          restore-keys: |
            global-deckbuilder-report-

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests and global validation
        shell: bash
        env:
          VALIDATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_mode || 'fast' }}
        run: |
          set +e
          mkdir -p artifacts/global

          python -m pytest 2>&1 | tee artifacts/global/pytest.log
          TEST_STATUS=${PIPESTATUS[0]}

          if [ "$VALIDATION_MODE" = "full" ]; then
            VALIDATION_SCRIPT=scripts/ci_global_validation.py
          else
            VALIDATION_SCRIPT=scripts/ci_global_validation_fast.py
          fi
          echo "Validation mode: $VALIDATION_MODE ($VALIDATION_SCRIPT)"

          THUN_REUSE_CARD_DATABASE=1 python "$VALIDATION_SCRIPT" 2>&1 \
            | tee artifacts/global/global-validation.log
          VALIDATION_STATUS=${PIPESTATUS[0]}

          {
            echo "TEST_STATUS=${TEST_STATUS}"
            echo "VALIDATION_STATUS=${VALIDATION_STATUS}"
            echo "VALIDATION_MODE=${VALIDATION_MODE}"
          } > artifacts/global/status.env

          printf 'tests=%s\nglobal_validation=%s\nmode=%s\n' \
            "$TEST_STATUS" "$VALIDATION_STATUS" "$VALIDATION_MODE" \
            > artifacts/global/status.txt
          exit 0

      - name: Save card database cache
        if: steps.cards-cache.outputs.cache-hit != 'true' && hashFiles('data/cards.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/cards.db
          key: global-cards-db-v2-${{ runner.os }}-${{ hashFiles('config/thun.toml', 'scripts/ci_global_validation.py', 'scripts/ci_global_validation_fast.py') }}

      - name: Prepare next comparison baseline
        if: always() && hashFiles('artifacts/global/global-report.json') != ''
        shell: bash
        run: |
          mkdir -p .ci-baseline
          cp artifacts/global/global-report.json .ci-baseline/global-report.json

      - name: Save global comparison baseline
        if: always() && hashFiles('.ci-baseline/global-report.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .ci-baseline/global-report.json
          key: global-deckbuilder-report-${{ github.run_id }}

      - name: Record branch and pull request
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > artifacts/global/branch-sha.txt
          printf 'branch=codex/global-deckbuilder-calibration\npull_request=14\n' \
            > artifacts/global/source.txt

      - name: Upload tests, decks, reports, simulations, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-deckbuilder-${{ github.run_number }}
          path: artifacts/global/
          retention-days: 7
          if-no-files-found: error

      - name: Enforce results
        if: always()
        shell: bash
        run: |
          if [ ! -f artifacts/global/status.env ]; then
            echo "Global validation did not produce a status file."
            exit 1
          fi
          source artifacts/global/status.env
          if [ "$TEST_STATUS" -ne 0 ] || [ "$VALIDATION_STATUS" -ne 0 ]; then
            echo "Global validation failed: tests=$TEST_STATUS validation=$VALIDATION_STATUS mode=${VALIDATION_MODE:-unknown}"
            exit 1
          fi
          echo "Tests and global multi-archetype validation passed in ${VALIDATION_MODE:-unknown} mode."

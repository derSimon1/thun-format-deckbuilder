name: Hybrid Prowess Validation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hybrid-prowess-validation.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: hybrid-prowess-validation
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/observed-strength-izzet-v2
  TARGET_PR: "13"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore card database cache
        id: cards-cache
        uses: actions/cache/restore@v4
        with:
          path: data/cards.db
          key: cards-db-v3-${{ runner.os }}-${{ hashFiles('config/thun.toml', 'scripts/ci_generate_prowess.py') }}

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Record branch and pull-request metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/branch-sha.txt
          git status --short --branch > artifacts/branch-status.txt
          if command -v gh >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}" \
              > artifacts/pull-request.json \
              || printf '{"error":"Unable to read pull request %s"}\n' \
                "$TARGET_PR" > artifacts/pull-request.json
          else
            printf '{"error":"GitHub CLI unavailable"}\n' \
              > artifacts/pull-request.json
          fi

      - name: Run tests, generation, and validation
        shell: bash
        run: |
          set +e
          mkdir -p artifacts

          python -m pytest 2>&1 | tee artifacts/pytest.log
          TEST_STATUS=${PIPESTATUS[0]}

          THUN_REUSE_CARD_DATABASE=1 python scripts/ci_generate_prowess.py 2>&1 \
            | tee artifacts/generation.log
          GENERATION_STATUS=${PIPESTATUS[0]}

          {
            echo "TEST_STATUS=${TEST_STATUS}"
            echo "GENERATION_STATUS=${GENERATION_STATUS}"
          } > artifacts/status.env

          printf 'tests=%s\ngeneration=%s\n' \
            "$TEST_STATUS" "$GENERATION_STATUS" > artifacts/status.txt
          exit 0

      - name: Save card database cache
        if: steps.cards-cache.outputs.cache-hit != 'true' && hashFiles('data/cards.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/cards.db
          key: cards-db-v3-${{ runner.os }}-${{ hashFiles('config/thun.toml', 'scripts/ci_generate_prowess.py') }}

      - name: Collect generated deck artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          for file in \
            izzet-prowess-v2-arena.txt \
            izzet-prowess-v2-validation.txt \
            izzet-prowess-v2-validation.json
          do
            if [ -f "$file" ]; then
              cp "$file" artifacts/
            fi
          done
          printf 'workflow_run=%s\ntarget_branch=%s\ntarget_pr=%s\nchecked_at_utc=%s\n' \
            "$GITHUB_RUN_ID" "$TARGET_BRANCH" "$TARGET_PR" "$(date -u +%FT%TZ)" \
            > artifacts/run-metadata.txt

      - name: Upload deck, validation, and error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-prowess-${{ github.run_number }}
          path: artifacts/
          retention-days: 3
          if-no-files-found: error

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          if [ ! -f artifacts/status.env ]; then
            echo "Validation did not produce a status file."
            exit 1
          fi
          source artifacts/status.env
          if [ "$TEST_STATUS" -ne 0 ] || [ "$GENERATION_STATUS" -ne 0 ]; then
            echo "Hybrid validation failed: tests=$TEST_STATUS generation=$GENERATION_STATUS"
            exit 1
          fi
          echo "Hybrid validation passed."
